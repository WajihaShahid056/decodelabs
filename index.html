<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
            min-height: 100vh;
        }

        /* Header */

        header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 18px 6%;
        }

        .navbar {
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #2563eb;
        }

        .nav-text {
            font-size: 14px;
            color: #6b7280;
        }

        /* Main */

        main {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        .page-heading {
            margin-bottom: 25px;
        }

        .page-heading h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .page-heading p {
            color: #6b7280;
            font-size: 15px;
        }

        /* Add Task */

        .task-form {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            margin-bottom: 25px;
        }

        .task-form h2 {
            font-size: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 90px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #2563eb;
        }

        .add-btn {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        /* Task Section */

        .task-section {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .task-header h2 {
            font-size: 20px;
        }

        .task-count {
            color: #6b7280;
            font-size: 14px;
        }

        /* Search and Filter */

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box {
            flex: 1;
        }

        .search-box input,
        .filter-select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
            background: #ffffff;
        }

        .search-box input:focus,
        .filter-select:focus {
            border-color: #2563eb;
        }

        .filter-box {
            width: 160px;
        }

        /* Task Card */

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-card {
            border: 1px solid #e5e7eb;
            border-radius: 9px;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        .task-card.completed {
            background: #f9fafb;
        }

        .task-content {
            flex: 1;
        }

        .task-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .task-description {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .task-status {
            display: inline-block;
            font-size: 12px;
            padding: 5px 9px;
            border-radius: 20px;
            background: #dbeafe;
            color: #1d4ed8;
        }

        .completed .task-title {
            text-decoration: line-through;
            color: #6b7280;
        }

        .completed .task-status {
            background: #dcfce7;
            color: #15803d;
        }

        /* Buttons */

        .task-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .complete-btn,
        .delete-btn {
            border: none;
            padding: 9px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .complete-btn {
            background: #eff6ff;
            color: #2563eb;
        }

        .complete-btn:hover {
            background: #dbeafe;
        }

        .delete-btn {
            background: #fef2f2;
            color: #dc2626;
        }

        .delete-btn:hover {
            background: #fee2e2;
        }

        /* Empty State */

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6b7280;
        }

        .empty-state h3 {
            color: #374151;
            margin-bottom: 7px;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* Responsive */

        @media (max-width: 700px) {

            header {
                padding: 16px 5%;
            }

            .logo {
                font-size: 21px;
            }

            .nav-text {
                display: none;
            }

            main {
                width: 92%;
                margin: 25px auto;
            }

            .page-heading h1 {
                font-size: 27px;
            }

            .task-form,
            .task-section {
                padding: 18px;
            }

            .task-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .controls {
                flex-direction: column;
            }

            .filter-box {
                width: 100%;
            }

            .task-card {
                flex-direction: column;
            }

            .task-actions {
                width: 100%;
            }

            .complete-btn,
            .delete-btn {
                flex: 1;
            }
        }

        @media (max-width: 400px) {

            .page-heading h1 {
                font-size: 24px;
            }

            .task-form,
            .task-section {
                padding: 15px;
            }

            .task-card {
                padding: 14px;
            }

            .task-actions {
                flex-direction: column;
            }

            .complete-btn,
            .delete-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->

    <header>
        <nav class="navbar">
            <div class="logo">Task Manager</div>
            <div class="nav-text">Manage your tasks easily</div>
        </nav>
    </header>


    <!-- Main Content -->

    <main>

        <!-- Page Heading -->

        <section class="page-heading">
            <h1>My Tasks</h1>
            <p>Create and manage your daily tasks.</p>
        </section>


        <!-- Add Task Form -->

        <section class="task-form">

            <h2>Add New Task</h2>

            <form id="taskForm">

                <div class="form-group">
                    <label for="taskTitle">Task Title</label>

                    <input
                        type="text"
                        id="taskTitle"
                        placeholder="Enter task title"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="taskDescription">Description</label>

                    <textarea
                        id="taskDescription"
                        placeholder="Enter task description"
                        required
                    ></textarea>
                </div>


                <button type="submit" class="add-btn">
                    Add Task
                </button>

            </form>

        </section>


        <!-- Task List -->

        <section class="task-section">

            <div class="task-header">

                <div>
                    <h2>Task List</h2>
                    <div class="task-count" id="taskCount">
                        0 tasks
                    </div>
                </div>

            </div>


            <!-- Search and Filter -->

            <div class="controls">

                <div class="search-box">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search tasks..."
                    >
                </div>

                <div class="filter-box">

                    <select id="filterSelect" class="filter-select">

                        <option value="all">All Tasks</option>
                        <option value="pending">Pending</option>
                        <option value="completed">Completed</option>

                    </select>

                </div>

            </div>


            <!-- Tasks -->

            <div id="taskList" class="task-list"></div>

        </section>

    </main>


<script>
const taskForm = document.getElementById("taskForm");
const taskTitle = document.getElementById("taskTitle");
const taskDescription = document.getElementById("taskDescription");

const taskList = document.getElementById("taskList");
const taskCount = document.getElementById("taskCount");

const searchInput = document.getElementById("searchInput");
const filterSelect = document.getElementById("filterSelect");


// Backend API URL

const API_URL = "http://localhost:3000/api/tasks";


// Store tasks

let tasks = [];


// Get tasks from backend

async function loadTasks() {

    try {

        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error("Failed to fetch tasks");
        }

        tasks = await response.json();

        displayTasks();

    } catch (error) {

        console.error("Error loading tasks:", error);

        taskList.innerHTML = `
            <div class="empty-state">
                <h3>Unable to load tasks</h3>
                <p>Please make sure the backend server is running.</p>
            </div>
        `;

    }

}


// Display tasks

function displayTasks() {

    taskList.innerHTML = "";

    const searchText = searchInput.value.toLowerCase().trim();

    const filterValue = filterSelect.value;


    // Filter tasks

    const filteredTasks = tasks.filter(function(task) {

        const title = String(task.title || "");
        const description = String(task.description || "");


        const matchesSearch =
            title.toLowerCase().includes(searchText) ||
            description.toLowerCase().includes(searchText);


        let matchesFilter = true;


        if (filterValue === "completed") {

            matchesFilter = task.completed === 1 || task.completed === true;

        }


        if (filterValue === "pending") {

            matchesFilter = task.completed === 0 || task.completed === false;

        }


        return matchesSearch && matchesFilter;

    });


    // Update task count

    taskCount.textContent =
        tasks.length + (tasks.length === 1 ? " task" : " tasks");


    // Empty state

    if (filteredTasks.length === 0) {

        taskList.innerHTML = `
            <div class="empty-state">
                <h3>No tasks found</h3>
                <p>Add a new task or change your search/filter.</p>
            </div>
        `;

        return;

    }


    // Create task cards

    filteredTasks.forEach(function(task) {

        const taskCard = document.createElement("div");


        const isCompleted =
            task.completed === 1 || task.completed === true;


        taskCard.className =
            "task-card" + (isCompleted ? " completed" : "");


        taskCard.innerHTML = `

            <div class="task-content">

                <div class="task-title">
                    ${escapeHTML(String(task.title || ""))}
                </div>

                <div class="task-description">
                    ${escapeHTML(String(task.description || ""))}
                </div>

                <span class="task-status">
                    ${isCompleted ? "Completed" : "Pending"}
                </span>

            </div>


            <div class="task-actions">

                <button
                    class="complete-btn"
                    onclick="toggleTask(${task.id})"
                >
                    ${isCompleted ? "Mark Pending" : "Complete"}
                </button>


                <button
                    class="delete-btn"
                    onclick="deleteTask(${task.id})"
                >
                    Delete
                </button>

            </div>

        `;


        taskList.appendChild(taskCard);

    });

}


// Add new task

taskForm.addEventListener("submit", async function(event) {

    event.preventDefault();


    const title = taskTitle.value.trim();

    const description = taskDescription.value.trim();


    // Validate fields

    if (title === "" || description === "") {

        alert("Please fill in all fields.");

        return;

    }


    try {

        const response = await fetch(API_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                title: title,
                description: description
            })

        });


        const data = await response.json();


        if (!response.ok) {

            alert(data.message || "Failed to add task");

            return;

        }


        // Add returned task to frontend

        tasks.unshift(data.task);


        // Update display

        displayTasks();


        // Clear form

        taskForm.reset();

        taskTitle.focus();


    } catch (error) {

        console.error("Error adding task:", error);

        alert("Unable to connect to the backend server.");

    }

});


// Complete / pending task

async function toggleTask(id) {

    try {

        const response = await fetch(`${API_URL}/${id}`, {

            method: "PUT"

        });


        const data = await response.json();


        if (!response.ok) {

            alert(data.message || "Failed to update task");

            return;

        }


        // Reload tasks from database

        await loadTasks();


    } catch (error) {

        console.error("Error updating task:", error);

        alert("Unable to connect to the backend server.");

    }

}


// Delete task

async function deleteTask(id) {

    const confirmDelete =
        confirm("Are you sure you want to delete this task?");


    if (!confirmDelete) {

        return;

    }


    try {

        const response = await fetch(`${API_URL}/${id}`, {

            method: "DELETE"

        });


        const data = await response.json();


        if (!response.ok) {

            alert(data.message || "Failed to delete task");

            return;

        }


        // Remove task from frontend

        tasks = tasks.filter(function(task) {

            return task.id !== id;

        });


        displayTasks();


    } catch (error) {

        console.error("Error deleting task:", error);

        alert("Unable to connect to the backend server.");

    }

}


// Search tasks

searchInput.addEventListener("input", function() {

    displayTasks();

});


// Filter tasks

filterSelect.addEventListener("change", function() {

    displayTasks();

});


// Prevent HTML injection

function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


// Load tasks when page loads

loadTasks();

</script>

    </body>
</html>
